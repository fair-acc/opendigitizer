# GR4's quality bots (fair-acc/gnuradio4 devtools/qualitybot.cpp) on this tree: each key overrides GR4's value
marker             = opendigitizer
author             = opendigitizer metrics
namingArguments    = --root src
codeStyleArguments = --root src/ui --root src/service --root src/acquisition --root src/utils
coverageAreas      = ui=src/ui/ service=src/service/ acquisition=src/acquisition/ utils=src/utils/
coverageBuild      = the instrumented Clang 21 build (libc++, against the prebuilt GR4)
coverageExcluded   = (/_deps/|/test/|/usr/|/opt/|/build/|/\.gr4-devtools/)
# bumped by hand when the coverage job's instrumentation flags change
coverageMethod     = clang-21/llvm-cov-21/1
# nothing to measure yet: no bm_ benchmark
hotPathBenchmarks  =
hotPathBinaries    =
# relative to the ci-gcc-release build tree: the static-blocklibs UI module the Pages deploy ships
wasmModules        = CMakeExternals/Build/ui-wasm/web/index.wasm
